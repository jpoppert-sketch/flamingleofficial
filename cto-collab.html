<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flamingle — This Role Isn't Open Right Now</title>
  <meta name="description" content="Flamingle isn't actively looking for a technical co-founder right now.">
  <meta http-equiv="refresh" content="6;url=team.html">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --coral: #f77a70;
      --coral-dark: #e8635a;
      --coral-light: #fde4e2;
      --charcoal: #2C2C2C;
      --white: #ffffff;
    }
    body {
      font-family: 'Nunito', Arial, sans-serif;
      color: var(--charcoal);
      background: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; }
    .wrap img { height: 48px; width: auto; margin-bottom: 28px; }
    h1 {
      font-family: 'Abril Fatface', Georgia, serif;
      font-size: clamp(26px, 5vw, 36px);
      line-height: 1.2;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(44,44,44,0.75);
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-block;
      padding: 14px 32px;
      background: var(--coral);
      color: var(--white);
      font-weight: 800;
      font-size: 15px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }
    a.btn:hover { background: var(--coral-dark); }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="flamingo_logo_transparent.png" alt="Flamingle">
    <h1>This Role Isn't Open Right Now.</h1>
    <p>We're not actively looking for a technical co-founder anymore — turns out the app didn't need one. Right now we're focused on finding the right person to lead our content and story. Redirecting you to the team page in a few seconds.</p>
    <a href="team.html" class="btn">Go to Team Page →</a>
  </div>
</body>
</html>
